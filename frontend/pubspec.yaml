name: pocket_lawyer
description: "AI-powered legal companion for KitaHack 2026."
publish_to: none

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Fonts
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0
  google_fonts: ^8.0.1

  # Networking & file handling
  http: ^1.0.0
  file_picker: ^10.3.10

  # Optional Generative AI features
  google_generative_ai: ^0.4.0
  flutter_markdown_plus: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Fonts setup
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500

  # Assets setup (ready for images/icons)
  assets:
    - assets/images/
    - assets/icons/

name: pocket_lawyer
description: "AI-powered legal companion for KitaHack 2026."
publish_to: none

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Core Persistence & Logic ---
  shared_preferences: ^2.2.2
  intl: ^0.20.2

  # --- UI, Icons & Animations ---
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0
  animate_do: ^3.3.4       
  lottie: ^3.1.0          

  # --- Networking & File Handling ---
  http: ^1.1.0
  file_picker: ^8.0.0
  image_picker: ^1.0.4

  # --- Generative AI & Markdown Support ---
  google_generative_ai: ^0.4.0
  flutter_markdown: ^0.6.18+2

  # --- Firebase Suite 
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  firebase_storage: ^12.0.0
  cloud_functions: ^5.0.0

  # --- PDF Generation, Printing & Sharing ---
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  
  assets:
    - assets/
  

  # Fonts setup for consistent branding
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500